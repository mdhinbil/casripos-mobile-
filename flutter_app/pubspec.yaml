name: casripos
description: Casri POS — point of sale for shops, restaurants and cafes.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Local storage. The whole till must work with no network, so everything is
  # kept on the device and only mirrored to the cloud when there is a signal.
  shared_preferences: ^2.2.3
  # Cloud sync + backup talk to Firebase over REST, exactly as the web app does,
  # so both versions read and write the same documents during the changeover.
  http: ^1.2.1
  # Backup export writes a file and hands it to the share sheet. Restore takes
  # pasted backup text (see settings_screen), so no native file-picker plugin is
  # needed — file_picker's Android module was a recurring build-blocker.
  path_provider: ^2.1.3
  # Share the exported backup file to WhatsApp/Drive/cable. Share.shareXFiles
  # still works (deprecated in 10.x, removed in 11.x).
  share_plus: ^10.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Generates the Android launcher icons from the Casri POS brand icon, so the
  # native app matches the previous (WebView) app instead of the default Flutter
  # logo. Run in CI after `flutter create` regenerates the android project.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Casri POS launcher icon (512x512 brand mark). The mark sits on a white field,
# so the adaptive background is white too — the blue terminal stays centred and
# the launcher applies its own mask shape.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground.png"
