name: casripos
description: Casri POS — point of sale for shops, restaurants and cafes.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Local storage. The whole till must work with no network, so everything is
  # kept on the device and only mirrored to the cloud when there is a signal.
  shared_preferences: ^2.2.3
  # Cloud sync + backup talk to Firebase over REST, exactly as the web app does,
  # so both versions read and write the same documents during the changeover.
  http: ^1.2.1
  # Backup export/import. v11+ inherits the app's compileSdk (36); older 8.x
  # hardcoded its own Android module to compileSdk 34, which fails the AAR
  # metadata check against newer transitive plugins.
  file_picker: ^11.0.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
